name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android files
        run: flutter create --platforms=android --project-name qashan_fund .
      - name: Set minSdk
        run: |
          for G in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$G" ] && sed -i -e 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$G" || true
          done
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: qashan-fund-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
